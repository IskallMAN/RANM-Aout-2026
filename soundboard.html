<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cue Sheet — Live Soundboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121317;
    --panel:#1a1c22;
    --panel-2:#20232b;
    --panel-3:#262a33;
    --border:#2d313b;
    --text:#e9e7e1;
    --text-dim:#8b8f9a;
    --text-faint:#5c606b;
    --amber:#e8a33d;
    --amber-dim:#b9822f;
    --red:#d9534f;
    --green:#6fae7f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  ::selection{background:var(--amber);color:#14161a;}

  /* subtle backstage worklight texture */
  body{
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,0.06), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(217,79,79,0.04), transparent 55%);
  }

  .app{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:56px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:20;
  }
  .topbar .brand{display:flex;align-items:baseline;gap:10px;}
  .topbar .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:.14em;
    color:var(--amber-dim);text-transform:uppercase;
  }
  #showTitle{
    font-family:'Fraunces',serif;
    font-weight:600;font-size:19px;
    color:var(--text);
    background:transparent;border:none;outline:none;
    min-width:120px;
  }
  #showTitle:focus{outline:1px dashed var(--amber-dim);outline-offset:4px;}
  .topbar .actions{display:flex;gap:10px;align-items:center;}
  .stopall{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;
    background:var(--panel-3);color:var(--red);
    border:1px solid var(--border);border-radius:5px;
    padding:8px 12px;cursor:pointer;text-transform:uppercase;
  }
  .stopall:hover{border-color:var(--red);}
  .stopall:disabled{opacity:.35;cursor:default;border-color:var(--border);}
  .livecount{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
    display:flex;align-items:center;gap:6px;
  }
  .livedot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);}
  .livedot.on{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ---------- LEFT: SCRIPT / WALKTHROUGH ---------- */
  .script{
    flex:1.5;
    margin-top:56px;
    height:calc(100vh - 56px);
    overflow-y:auto;
    padding:34px 40px 120px;
  }
  .scene{
    margin-bottom:38px;
    position:relative;
  }
  .scene-head{
    display:flex;align-items:baseline;gap:14px;
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
  }
  .scene-num{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--amber-dim);letter-spacing:.1em;
  }
  .scene-title{
    font-family:'Fraunces',serif;font-weight:600;font-size:22px;
    color:var(--text);outline:none;flex:1;
    background:transparent;border:none;min-width:60px;
  }
  .scene-title:focus{outline:1px dashed var(--amber-dim);outline-offset:3px;}
  .scene-del{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);
    background:none;border:none;cursor:pointer;opacity:0;transition:opacity .15s;
  }
  .scene:hover .scene-del{opacity:1;}
  .scene-del:hover{color:var(--red);}

  .cue{
    display:flex;align-items:flex-start;gap:12px;
    padding:9px 10px;border-radius:6px;
    margin-bottom:2px;
    transition:background .12s;
  }
  .cue:hover{background:var(--panel);}
  .cue.playing{background:rgba(232,163,61,0.07);}
  .cue-sq{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);
    padding-top:3px;min-width:38px;letter-spacing:.03em;
  }
  .cue.playing .cue-sq{color:var(--amber);}
  .cue-dot{
    width:6px;height:6px;border-radius:50%;background:var(--text-faint);
    margin-top:6px;flex-shrink:0;
  }
  .cue.playing .cue-dot{background:var(--amber);box-shadow:0 0 6px var(--amber);animation:pulse 1.4s ease-in-out infinite;}
  .cue-text{
    flex:1;font-size:14.5px;line-height:1.5;color:var(--text);
    outline:none;padding:2px 0;min-height:20px;
  }
  .cue-text:focus{outline:1px dashed var(--amber-dim);outline-offset:3px;}
  .cue-text:empty:before{content:attr(data-placeholder);color:var(--text-faint);}
  .cue-file{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);
    margin-top:3px;display:flex;align-items:center;gap:5px;
  }
  .cue-file .fname{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cue-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
  .btn-icon{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    background:var(--panel-3);border:1px solid var(--border);color:var(--text-dim);
    border-radius:5px;padding:6px 10px;cursor:pointer;white-space:nowrap;
  }
  .btn-icon:hover{border-color:var(--amber-dim);color:var(--text);}
  .btn-play{
    background:var(--amber);color:#181008;border:1px solid var(--amber);font-weight:600;
  }
  .btn-play:hover{background:#f0ae4c;}
  .btn-play.is-on{background:var(--panel-3);color:var(--amber);border-color:var(--amber);}
  .cue-del{
    background:none;border:none;color:var(--text-faint);cursor:pointer;
    font-size:13px;opacity:0;transition:opacity .15s;padding:4px;
  }
  .cue:hover .cue-del{opacity:1;}
  .cue-del:hover{color:var(--red);}

  .add-cue{
    display:flex;gap:8px;margin:8px 0 0 50px;
  }
  .add-cue input{
    flex:1;background:transparent;border:none;border-bottom:1px dashed var(--border);
    color:var(--text-dim);font-size:13px;padding:6px 2px;outline:none;font-family:'Inter',sans-serif;
  }
  .add-cue input:focus{border-color:var(--amber-dim);color:var(--text);}
  .add-cue button{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);
    background:none;border:none;cursor:pointer;
  }
  .add-cue button:hover{color:var(--amber);}

  .add-scene{
    margin-top:10px;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em;
    color:var(--text-dim);background:var(--panel);border:1px dashed var(--border);
    border-radius:7px;padding:12px;width:100%;cursor:pointer;text-transform:uppercase;
  }
  .add-scene:hover{border-color:var(--amber-dim);color:var(--amber);}

  .empty-script{
    color:var(--text-faint);font-size:14px;padding:40px 0;text-align:center;
  }

  /* ---------- RIGHT: LIVE CONSOLE / PLAY-STACK ---------- */
  .console{
    width:380px;flex-shrink:0;
    margin-top:56px;
    height:calc(100vh - 56px);
    background:var(--panel);
    border-left:1px solid var(--border);
    overflow-y:auto;
    padding:20px 16px 60px;
  }
  .console-label{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;
    color:var(--text-faint);text-transform:uppercase;margin-bottom:16px;padding:0 4px;
  }
  .empty-stack{
    color:var(--text-faint);font-size:13px;text-align:center;padding:60px 20px;line-height:1.6;
  }

  .strip{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:14px;
    margin-bottom:12px;
  }
  .strip.playing{border-color:rgba(232,163,61,0.4);}
  .strip-head{
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px;
  }
  .strip-title{
    font-size:13px;font-weight:600;color:var(--text);line-height:1.35;
  }
  .strip-scene{
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber-dim);
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;
  }
  .strip-close{
    background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;padding:2px 4px;flex-shrink:0;
  }
  .strip-close:hover{color:var(--red);}

  .strip-body{display:flex;gap:12px;align-items:center;margin-top:10px;}
  .transport{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:var(--amber);color:#181008;border:none;cursor:pointer;
    font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  .transport:hover{background:#f0ae4c;}
  .strip-mid{flex:1;min-width:0;}
  .seekrow{display:flex;align-items:center;gap:8px;}
  .time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);flex-shrink:0;width:34px;}
  .time.dur{text-align:right;}
  input[type=range].seek{
    flex:1;-webkit-appearance:none;appearance:none;height:3px;
    background:var(--border);border-radius:2px;outline:none;
  }
  input[type=range].seek::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--amber);cursor:pointer;margin-top:0;
  }
  input[type=range].seek::-moz-range-thumb{
    width:11px;height:11px;border-radius:50%;background:var(--amber);border:none;cursor:pointer;
  }

  .fader-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:34px;}
  .fader-track{height:64px;display:flex;align-items:center;justify-content:center;}
  input[type=range].fader{
    -webkit-appearance:none;appearance:none;
    writing-mode:vertical-lr;direction:rtl;
    width:4px;height:60px;
    background:var(--border);border-radius:2px;outline:none;
  }
  input[type=range].fader::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:9px;border-radius:2px;
    background:var(--text-dim);cursor:pointer;
  }
  input[type=range].fader::-moz-range-thumb{
    width:16px;height:9px;border-radius:2px;background:var(--text-dim);border:none;cursor:pointer;
  }
  .fader-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-faint);}

  .scroll-fade{
    position:fixed;bottom:0;height:40px;pointer-events:none;
    background:linear-gradient(transparent,var(--bg));
  }

  /* scrollbars */
  .script::-webkit-scrollbar, .console::-webkit-scrollbar{width:8px;}
  .script::-webkit-scrollbar-thumb, .console::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:4px;}
  .script::-webkit-scrollbar-track, .console::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="eyebrow">Cue&nbsp;Sheet</span>
    <input id="showTitle" value="Untitled Production" spellcheck="false">
  </div>
  <div class="actions">
    <div class="livecount"><span class="livedot" id="liveDot"></span><span id="liveCountText">nothing playing</span></div>
    <button class="stopall" id="stopAllBtn" disabled>Stop All</button>
  </div>
</div>

<div class="app">
  <div class="script" id="script"></div>
  <div class="console" id="console">
    <div class="console-label">Live · Play Stack</div>
    <div id="stack"></div>
  </div>
</div>

<script>
/* ---------------- STATE ---------------- */
let scenes = [
  { id: uid(), title: "Scene 1", cues: [
      { id: uid(), text: "Lights up. House goes dark, walk-in music fades out.", fileName:null, url:null }
  ]}
];
// stack: array of {id, cueId, audio, node, dragging}
let stack = [];

function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---------------- SCENES / SCRIPT RENDER ---------------- */
const scriptEl = document.getElementById('script');

function findCue(cueId){
  for(const s of scenes) for(const c of s.cues) if(c.id===cueId) return {scene:s, cue:c};
  return null;
}

function renderScript(){
  if(scenes.length===0){
    scriptEl.innerHTML = `<div class="empty-script">No scenes yet. Add your first one below.</div>
      <button class="add-scene" data-action="add-scene">+ Add Scene</button>`;
    return;
  }
  let html = '';
  scenes.forEach((scene, si)=>{
    html += `<div class="scene" data-scene-id="${scene.id}">
      <div class="scene-head">
        <span class="scene-num">SC ${si+1}</span>
        <div class="scene-title" contenteditable="true" data-action="scene-title" data-scene-id="${scene.id}">${escapeHtml(scene.title)}</div>
        <button class="scene-del" data-action="del-scene" data-scene-id="${scene.id}">remove scene</button>
      </div>
      <div class="cue-list">`;
    scene.cues.forEach((cue, ci)=>{
      const isPlaying = stack.some(t=>t.cueId===cue.id);
      const sq = `SQ${si+1}.${ci+1}`;
      html += `<div class="cue ${isPlaying?'playing':''}" data-cue-id="${cue.id}">
          <span class="cue-sq">${sq}</span>
          <span class="cue-dot"></span>
          <div style="flex:1;min-width:0;">
            <div class="cue-text" contenteditable="true" data-action="cue-text" data-cue-id="${cue.id}" data-placeholder="Cue text…">${escapeHtml(cue.text)}</div>
            ${cue.fileName ? `<div class="cue-file">🔊 <span class="fname">${escapeHtml(cue.fileName)}</span></div>` : ''}
          </div>
          <div class="cue-actions">
            <label class="btn-icon" title="Attach audio file">
              ${cue.fileName ? 'Replace' : 'Attach'}
              <input type="file" accept="audio/*" style="display:none" data-action="attach" data-cue-id="${cue.id}">
            </label>
            ${cue.fileName ? `<button class="btn-icon btn-play ${isPlaying?'is-on':''}" data-action="play" data-cue-id="${cue.id}">${isPlaying?'⏸ On':'▶ Play'}</button>` : ''}
            <button class="cue-del" data-action="del-cue" data-cue-id="${cue.id}" title="Delete cue">✕</button>
          </div>
        </div>`;
    });
    html += `</div>
      <div class="add-cue">
        <input type="text" placeholder="New cue text — press Enter to add" data-action="new-cue-input" data-scene-id="${scene.id}">
        <button data-action="add-cue" data-scene-id="${scene.id}">+ Add cue</button>
      </div>
    </div>`;
  });
  html += `<button class="add-scene" data-action="add-scene">+ Add Scene</button>`;
  scriptEl.innerHTML = html;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------------- EVENT DELEGATION: SCRIPT ---------------- */
scriptEl.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='add-scene'){
    scenes.push({ id:uid(), title:`Scene ${scenes.length+1}`, cues:[] });
    renderScript();
  }
  else if(action==='del-scene'){
    const sceneId = t.dataset.sceneId;
    const scene = scenes.find(s=>s.id===sceneId);
    if(scene){
      scene.cues.forEach(c=> removeFromStack(c.id, true));
      scenes = scenes.filter(s=>s.id!==sceneId);
      renderScript();
    }
  }
  else if(action==='del-cue'){
    const cueId = t.dataset.cueId;
    removeFromStack(cueId, true);
    scenes.forEach(s=> s.cues = s.cues.filter(c=>c.id!==cueId));
    renderScript();
  }
  else if(action==='add-cue'){
    addCueFromInput(t.dataset.sceneId);
  }
  else if(action==='play'){
    togglePlay(t.dataset.cueId);
  }
});

scriptEl.addEventListener('keydown', (e)=>{
  if(e.target.dataset.action==='new-cue-input' && e.key==='Enter'){
    e.preventDefault();
    addCueFromInput(e.target.dataset.sceneId);
  }
  // prevent Enter from inserting newline in contenteditable text fields
  if((e.target.dataset.action==='cue-text' || e.target.dataset.action==='scene-title') && e.key==='Enter'){
    e.preventDefault();
    e.target.blur();
  }
});

function addCueFromInput(sceneId){
  const input = scriptEl.querySelector(`input[data-action="new-cue-input"][data-scene-id="${sceneId}"]`);
  const text = input.value.trim();
  if(!text) return;
  const scene = scenes.find(s=>s.id===sceneId);
  scene.cues.push({ id:uid(), text, fileName:null, url:null });
  renderScript();
  const newInput = scriptEl.querySelector(`input[data-action="new-cue-input"][data-scene-id="${sceneId}"]`);
  if(newInput) newInput.focus();
}

scriptEl.addEventListener('change', (e)=>{
  if(e.target.dataset.action==='attach'){
    const cueId = e.target.dataset.cueId;
    const file = e.target.files[0];
    if(!file) return;
    const found = findCue(cueId);
    if(!found) return;
    if(found.cue.url) URL.revokeObjectURL(found.cue.url);
    found.cue.url = URL.createObjectURL(file);
    found.cue.fileName = file.name;
    removeFromStack(cueId, true); // if it was playing an old file, stop it
    renderScript();
  }
});

// save contenteditable edits on blur (delegated via focusout, which bubbles)
scriptEl.addEventListener('focusout', (e)=>{
  if(e.target.dataset.action==='scene-title'){
    const scene = scenes.find(s=>s.id===e.target.dataset.sceneId);
    if(scene) scene.title = e.target.textContent.trim() || 'Untitled Scene';
  }
  else if(e.target.dataset.action==='cue-text'){
    const found = findCue(e.target.dataset.cueId);
    if(found) found.cue.text = e.target.textContent.trim();
    renderScript(); // refresh stack labels too
    syncStackLabels();
  }
});

/* ---------------- PLAY STACK / CONSOLE ---------------- */
const stackEl = document.getElementById('stack');
const stopAllBtn = document.getElementById('stopAllBtn');
const liveDot = document.getElementById('liveDot');
const liveCountText = document.getElementById('liveCountText');

function togglePlay(cueId){
  const existing = stack.find(t=>t.cueId===cueId);
  if(existing){
    if(existing.audio.paused){ existing.audio.play(); } else { existing.audio.pause(); }
    return;
  }
  const found = findCue(cueId);
  if(!found || !found.cue.url) return;
  addToStack(found.scene, found.cue);
}

function addToStack(scene, cue){
  const audio = new Audio(cue.url);
  audio.volume = 0.85;
  const track = { id: uid(), cueId: cue.id, audio, node: null };
  stack.push(track);

  const node = buildStrip(track, scene, cue);
  track.node = node;
  stackEl.prepend(node);

  audio.addEventListener('loadedmetadata', ()=>{
    const seek = node.querySelector('.seek');
    seek.max = audio.duration || 0;
    node.querySelector('.dur').textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('timeupdate', ()=>{
    if(track.dragging) return;
    node.querySelector('.seek').value = audio.currentTime;
    node.querySelector('.cur').textContent = fmtTime(audio.currentTime);
  });
  audio.addEventListener('play', ()=>{
    node.classList.add('playing');
    node.querySelector('.transport').textContent = '⏸';
    refreshScriptPlayingState();
    updateLiveIndicator();
  });
  audio.addEventListener('pause', ()=>{
    node.classList.remove('playing');
    node.querySelector('.transport').textContent = '▶';
    refreshScriptPlayingState();
    updateLiveIndicator();
  });
  audio.addEventListener('ended', ()=>{
    removeFromStack(cue.id, true);
  });

  audio.play();
  renderScript(); // to show "On" state on the cue row
  updateLiveIndicator();
}

function buildStrip(track, scene, cue){
  const div = document.createElement('div');
  div.className = 'strip';
  div.dataset.trackId = track.id;
  div.innerHTML = `
    <div class="strip-head">
      <div style="min-width:0;">
        <div class="strip-scene">${escapeHtml(scene.title)}</div>
        <div class="strip-title">${escapeHtml(cue.text || cue.fileName)}</div>
      </div>
      <button class="strip-close" data-action="remove" title="Stop and remove">✕</button>
    </div>
    <div class="strip-body">
      <button class="transport" data-action="toggle">▶</button>
      <div class="strip-mid">
        <div class="seekrow">
          <span class="time cur">0:00</span>
          <input type="range" class="seek" min="0" max="0" step="0.01" value="0">
          <span class="time dur">0:00</span>
        </div>
      </div>
      <div class="fader-col">
        <div class="fader-track"><input type="range" class="fader" min="0" max="1" step="0.01" value="0.85"></div>
        <span class="fader-label">VOL</span>
      </div>
    </div>
  `;

  div.querySelector('[data-action="toggle"]').addEventListener('click', ()=>{
    if(track.audio.paused) track.audio.play(); else track.audio.pause();
  });
  div.querySelector('[data-action="remove"]').addEventListener('click', ()=>{
    removeFromStack(track.cueId, true);
  });
  const seek = div.querySelector('.seek');
  seek.addEventListener('pointerdown', ()=> track.dragging = true);
  seek.addEventListener('input', ()=>{
    div.querySelector('.cur').textContent = fmtTime(parseFloat(seek.value));
  });
  seek.addEventListener('change', ()=>{
    track.audio.currentTime = parseFloat(seek.value);
    track.dragging = false;
  });
  div.querySelector('.fader').addEventListener('input', (e)=>{
    track.audio.volume = parseFloat(e.target.value);
  });

  return div;
}

function removeFromStack(cueId, stop){
  const idx = stack.findIndex(t=>t.cueId===cueId);
  if(idx===-1) return;
  const track = stack[idx];
  if(stop){ track.audio.pause(); }
  track.node.remove();
  stack.splice(idx,1);
  refreshScriptPlayingState();
  updateLiveIndicator();
  renderStackEmptyState();
}

function stopAll(){
  [...stack].forEach(t=> removeFromStack(t.cueId, true));
  renderScript();
}
stopAllBtn.addEventListener('click', stopAll);

function refreshScriptPlayingState(){
  // lightweight: toggle classes/labels without full re-render, to avoid disrupting contenteditable focus
  document.querySelectorAll('.cue').forEach(cueEl=>{
    const cueId = cueEl.dataset.cueId;
    const track = stack.find(t=>t.cueId===cueId);
    const isPlaying = !!track && !track.audio.paused;
    cueEl.classList.toggle('playing', isPlaying);
    const btn = cueEl.querySelector('[data-action="play"]');
    if(btn){
      btn.classList.toggle('is-on', !!track);
      btn.textContent = track ? (track.audio.paused ? '▶ Resume' : '⏸ On') : '▶ Play';
    }
  });
}

function syncStackLabels(){
  stack.forEach(t=>{
    const found = findCue(t.cueId);
    if(found && t.node){
      t.node.querySelector('.strip-title').textContent = found.cue.text || found.cue.fileName;
    }
  });
}

function updateLiveIndicator(){
  const playingCount = stack.filter(t=>!t.audio.paused).length;
  liveDot.classList.toggle('on', playingCount>0);
  stopAllBtn.disabled = stack.length===0;
  if(stack.length===0) liveCountText.textContent = 'nothing playing';
  else if(playingCount===0) liveCountText.textContent = `${stack.length} paused`;
  else liveCountText.textContent = `${playingCount} playing · ${stack.length} on deck`;
}

function renderStackEmptyState(){
  let empty = stackEl.querySelector('.empty-stack');
  if(stack.length===0){
    if(!empty){
      stackEl.insertAdjacentHTML('afterbegin', `<div class="empty-stack">Nothing playing yet.<br>Click ▶ on a cue to send it here.</div>`);
    }
  } else if(empty){
    empty.remove();
  }
}

function fmtTime(s){
  if(!isFinite(s) || s<0) s=0;
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

/* ---------------- INIT ---------------- */
renderScript();
renderStackEmptyState();
updateLiveIndicator();
</script>
</body>
</html>
